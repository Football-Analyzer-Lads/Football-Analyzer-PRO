name: Import V6_1_2 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop if already imported
        if: hashFiles('.github/V6_1_2_IMPORTED') != ''
        run: echo "V6_1_2 source already imported."

      - name: Import release source
        if: hashFiles('.github/V6_1_2_IMPORTED') == ''
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/football_analyzer.zip "https://github.com/Football-Analyzer-Lads/Football-Analyzer-PRO/releases/download/V6_1_2/Football_Analyzer_PRO_V6_1_2_HALF_TIME_SMART.zip"
          rm -rf /tmp/football_source
          mkdir -p /tmp/football_source
          unzip -q /tmp/football_analyzer.zip -d /tmp/football_source
          shopt -s dotglob nullglob
          roots=(/tmp/football_source/*)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            source="${roots[0]}"
          else
            source="/tmp/football_source"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -R "$source"/. .
          rm -rf .venv __pycache__ ./*/__pycache__ 2>/dev/null || true
          rm -f config.env
          cat > .gitignore <<'EOF'
config.env
.venv/
__pycache__/
*.pyc
.DS_Store
data/
cache/
EOF
          printf 'Imported from release V6_1_2.\n' > .github/V6_1_2_IMPORTED
          git config user.name "Football-Analyzer-Lads"
          git config user.email "f.biondi87@gmail.com"
          git add -A
          git commit -m "Import V6_1_2 application source"
          git push origin HEAD:main
