name: Validate Football Analyzer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile assembled Python application
        run: |
          python - <<'PY'
          from pathlib import Path
          parts = sorted(Path(".").glob("app_source_*.py"))
          source = "\n".join(p.read_text(encoding="utf-8").rstrip("\n") for p in parts) + "\n"
          compile(source, str(parts[0]), "exec")
          compile(Path("app.py").read_text(encoding="utf-8"), "app.py", "exec")
          print("Assembled application syntax: OK")
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frontend JavaScript
        run: node --check static/app.js
